[workspace]
resolver = "2"
members = ["zkfmi-zk","zkpi","zkpi-proofs","zkpi-committee","zkpi-optimistic","qomm-mpc","qomm-audit","qomm-dsl","qomm-sim","zkfmi-measure","zkpi-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "9f95ffc0bb3206517ffadb70223f2ebbcad5e908" }
# Audited by Quarkslab (2019, commissioned by Tari Labs, 30 man-days) together
# with subtle and bulletproofs. 4.1.3 is the first release carrying the fix for
# RUSTSEC-2024-0344, a timing leak LLVM introduced into Scalar::sub, so the
# floor is not negotiable.
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
bulletproofs = "5.0"
merlin = "3"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.5"
# Threshold Schnorr from the Zcash Foundation, partially audited by NCC Group
# (2023, v0.6.0). Replaces a hand-rolled threshold sigma protocol.
frost-ristretto255 = "3.0"
frost-core = "3.0"
# Ed25519 signatures for the KYB issuer. Same dalek assessment as the group.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
hex = "0.4"
thiserror = "1"
rand = "0.8"
regex = "1.13.1"
openssl = { version = "=0.10.81", features = ["vendored"] }
libc = "0.2"
zkfmi-zk = { path = "zkfmi-zk" }
zkpi = { path = "zkpi" }
zkpi-proofs = { path = "zkpi-proofs" }
qomm-dsl = { path = "qomm-dsl" }
zkfmi-measure = { path = "zkfmi-measure" }
qomm-sim = { path = "qomm-sim" }
qomm-mpc = { path = "qomm-mpc" }
qomm-audit = { path = "qomm-audit" }
zkpi-committee = { path = "zkpi-committee" }
zkpi-optimistic = { path = "zkpi-optimistic" }

[patch."https://github.com/zkFMI/zkpi.git"]
zkpi-proofs = { path = "zkpi-proofs" }
zkfmi-zk = { path = "zkfmi-zk" }
zkpi = { path = "zkpi" }
zkpi-committee = { path = "zkpi-committee" }
zkpi-optimistic = { path = "zkpi-optimistic" }
qomm-mpc = { path = "qomm-mpc" }
qomm-audit = { path = "qomm-audit" }
qomm-dsl = { path = "qomm-dsl" }
qomm-sim = { path = "qomm-sim" }
zkfmi-measure = { path = "zkfmi-measure" }
