[workspace]
resolver = "2"
members = ["qomm-zk","qomm-zkpi","qomm-proofs","qomm-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/shukob/zkfmi-crypto.git", rev = "713e842a7e298e6224297b03df9d6ade19148bb2" }
# Audited by Quarkslab (2019, commissioned by Tari Labs, 30 man-days) together
# with subtle and bulletproofs. 4.1.3 is the first release carrying the fix for
# RUSTSEC-2024-0344, a timing leak LLVM introduced into Scalar::sub, so the
# floor is not negotiable.
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
bulletproofs = "5.0"
merlin = "3"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.5"
# Threshold Schnorr from the Zcash Foundation, partially audited by NCC Group
# (2023, v0.6.0). Replaces a hand-rolled threshold sigma protocol.
frost-ristretto255 = "3.0"
frost-core = "3.0"
# Ed25519 signatures for the KYB issuer. Same dalek assessment as the group.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
hex = "0.4"
thiserror = "1"
rand = "0.8"
regex = "1.13.1"
openssl = { version = "=0.10.81", features = ["vendored"] }
libc = "0.2"
qomm-zk = { path = "qomm-zk" }
qomm-zkpi = { path = "qomm-zkpi" }
qomm-proofs = { path = "qomm-proofs" }
qomm-dsl = { git = "https://github.com/shukob/qomm.git", rev = "ba09d4c5886d37bc392d209f31dd1926e1402eed" }
qomm-measure = { git = "https://github.com/shukob/qomm.git", rev = "ba09d4c5886d37bc392d209f31dd1926e1402eed" }

[patch."https://github.com/shukob/zkpi.git"]
qomm-proofs = { path = "qomm-proofs" }
qomm-zk = { path = "qomm-zk" }
qomm-zkpi = { path = "qomm-zkpi" }
